<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Diwali ✨</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* Simple overlay style */
    #startOverlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: "Poppins", sans-serif;
      font-size: 1.5rem;
      z-index: 9999;
      text-align: center;
      cursor: pointer;
      transition: opacity 1s ease;
    }

    #startOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #startOverlay button {
      margin-top: 1rem;
      padding: 0.8rem 1.6rem;
      border: none;
      border-radius: 8px;
      background-color: #ffcc00;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #startOverlay button:hover {
      transform: scale(1.05);
    }

    p {
      position: fixed;
      bottom: 15px;
      width: 100%;
      text-align: center;
      color: #fff;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <!-- Canvas for fireworks or other animations -->
  <canvas id="c" aria-label="Diwali animation"></canvas>

  <!-- Hidden audio -->
  <audio id="diwaliAudio" src="./diwali.mp3" loop></audio>

  <!-- Overlay that asks the user to start -->
  <div id="startOverlay">
    <div>🎆 Tap anywhere to start the celebration 🎆</div>
    <button>Start Celebration</button>
  </div>

  <p>
    <a href="#" target="_blank" style="color:#ffd700;text-decoration:none;">Happy Diwali ✨</a>
    <span>• Made with ❤️</span>
  </p>

  <script src="./script.js"></script>

  <script>
    const overlay = document.getElementById('startOverlay');
    const audio = document.getElementById('diwaliAudio');

    // Function to start music + fade in
    function startCelebration() {
      overlay.classList.add('hidden');
      audio.volume = 0;
      audio.play().catch(err => console.log('Autoplay blocked:', err));
      let v = 0;
      const fade = setInterval(() => {
        if (v < 1) {
          v += 0.05;
          audio.volume = v;
        } else clearInterval(fade);
      }, 200);
      overlay.removeEventListener('click', startCelebration);
    }

    // Allow both click on overlay and button
    overlay.addEventListener('click', startCelebration);
    overlay.querySelector('button').addEventListener('click', startCelebration);
  </script>
</body>
</html>
